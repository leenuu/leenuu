name: Seasonal banner

on:
  schedule:
    # 매일 09:17 KST (00:17 UTC). 계절이 그대로면 아무것도 바뀌지 않으므로,
    # 1일 실행이 빠지거나 실패해도 다음 날 따라잡는다.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "테스트용 월(1-12). 비우면 이번 달"
        required: false

permissions:
  contents: write

# 두 워크플로가 동시에 main에 푸시하지 않도록 한 번에 하나씩만 실행한다.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Switch README banner to the current season
        id: banner
        env:
          MONTH: ${{ inputs.month }}
        run: |
          season="$(bash .github/scripts/update-banner.sh "$MONTH")"
          echo "season=$season" >> "$GITHUB_OUTPUT"

      - name: Commit if the banner changed
        env:
          SEASON: ${{ steps.banner.outputs.season }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Banner is already $SEASON."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: switch banner to $SEASON" -- README.md
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
